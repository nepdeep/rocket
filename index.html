<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#8b86e6" />
<meta name="description" content="Little Rocket: Moon Mail Delivery - a gentle 3D space-mail game for young children." />
<title>Little Rocket: Moon Mail Delivery</title>
<link rel="icon" href="data:," />
<style>
  :root { --ink: #2d2a4a; --b: 72px; --s: 62px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8b86e6; overscroll-behavior: none; }
  body {
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; color: var(--ink);
  }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: pointer; }
  .hud { position: fixed; z-index: 5; }

  /* Big round picture buttons (no words) */
  .round-btn {
    width: var(--b); height: var(--b); border-radius: 50%; border: 5px solid #fff;
    background: rgba(255, 255, 255, .88); box-shadow: 0 5px 0 rgba(45, 42, 74, .25);
    display: grid; place-items: center; padding: 0; cursor: pointer;
    transition: transform .15s ease, background-color .25s ease;
  }
  .round-btn:active { transform: translateY(3px) scale(.96); box-shadow: 0 2px 0 rgba(45, 42, 74, .25); }
  .round-btn svg { width: 64%; height: 64%; pointer-events: none; }
  .round-btn[aria-pressed="true"] { background: #ffe58a; }
  .round-btn:focus-visible { outline: 5px solid #ffe58a; outline-offset: 3px; }

  #controls { top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); display: flex; gap: 10px; }

  /* Delivery progress: three parcel slots that only ever fill up */
  #progress {
    top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
    display: flex; gap: 8px; padding: 8px; border-radius: 24px; background: rgba(255, 255, 255, .3);
  }
  .slot {
    width: var(--s); height: var(--s); border-radius: 18px; border: 4px dashed rgba(255, 255, 255, .95);
    background: rgba(255, 255, 255, .22); transition: background-color .4s ease;
  }
  .slot canvas { width: 100%; height: 100%; display: block; }
  .slot.filled { border-style: solid; background: #fff; animation: pop .55s ease; }
  #rounds {
    top: calc(var(--s) + 42px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left));
    display: flex; flex-wrap: wrap; gap: 4px; max-width: 46vw;
  }
  #rounds canvas { width: 36px; height: 36px; animation: pop .6s ease; }

  /* The parcel to deliver */
  #parcelCard {
    left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom));
    width: clamp(118px, 25vmin, 210px); height: clamp(118px, 25vmin, 210px);
    border-radius: 30px; background: rgba(255, 255, 255, .92); border: 6px solid #fff;
    box-shadow: 0 6px 0 rgba(45, 42, 74, .25); padding: 4px; cursor: pointer;
    transition: transform .45s cubic-bezier(.3, 1.5, .5, 1), opacity .35s ease;
  }
  #parcelCard canvas { width: 100%; height: 100%; display: block; }
  #parcelCard.away { transform: scale(.5) translateY(50px); opacity: 0; pointer-events: none; }
  #parcelCard.wiggle canvas { animation: wiggle .6s ease; }

  /* Picture hint: a tapping hand */
  #hand { position: fixed; z-index: 6; width: 92px; height: 116px; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity .5s ease; }
  #hand.show { opacity: 1; }
  #hand canvas { width: 100%; height: 100%; animation: tap 1.3s ease-in-out infinite; }

  #nextBtn {
    --b: 124px; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); background: #7be08f;
    transform: translateX(-50%); display: none;
  }
  #nextBtn.show { display: grid; animation: breathe 2.6s ease-in-out infinite; }
  #nextBtn svg { width: 74%; height: 74%; }

  /* Picture tutorial */
  #intro {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: clamp(12px, 3vh, 30px); padding: 16px; background: rgba(62, 56, 128, .74);
  }
  #intro.hidden { display: none; }
  .steps { display: grid; grid-template-columns: repeat(4, auto); gap: clamp(10px, 2vw, 22px); }
  .step {
    width: clamp(118px, 19vw, 220px); aspect-ratio: 1; background: #fff; border-radius: 30px;
    border: 6px solid #ffe58a; box-shadow: 0 6px 0 rgba(45, 42, 74, .3); overflow: hidden;
    opacity: 0; animation: stepIn .5s ease forwards;
  }
  .step:nth-child(2) { animation-delay: .25s; } .step:nth-child(3) { animation-delay: .5s; } .step:nth-child(4) { animation-delay: .75s; }
  .step canvas { width: 100%; height: 100%; display: block; }
  #playBtn { --b: 136px; background: #5bd17a; animation: breathe2 2.6s ease-in-out infinite; }
  #playBtn svg { width: 56%; height: 56%; }

  #nogl { position: fixed; inset: 0; display: none; place-items: center; background: #8b86e6; z-index: 20; }

  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  @keyframes tap { 0%, 100% { transform: translateY(16px); } 50% { transform: translateY(0); } }
  @keyframes breathe { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.06); } }
  @keyframes breathe2 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes stepIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* Reduced motion: no decorative CSS movement */
  body.reduced .step { animation: none; opacity: 1; }
  body.reduced #hand canvas { animation: none; transform: translateY(6px); }
  body.reduced #nextBtn.show { animation: none; }
  body.reduced #playBtn { animation: none; }
  body.reduced .slot.filled, body.reduced #rounds canvas { animation: none; }
  body.reduced #parcelCard { transition: opacity .3s ease; }
  body.reduced #parcelCard.away { transform: none; }
  body.reduced #parcelCard.wiggle canvas { animation: none; }

  @media (max-width: 760px) and (orientation: portrait) {
    .steps { grid-template-columns: repeat(2, auto); }
    .step { width: clamp(110px, 38vw, 210px); }
  }
  @media (max-width: 620px) {
    :root { --b: 58px; --s: 48px; }
    #controls { flex-direction: column; }
    #playBtn { --b: 116px; }
    #nextBtn { --b: 108px; }
  }
  @media (max-height: 460px) {
    :root { --b: 56px; --s: 46px; }
    .step { width: clamp(96px, 20vw, 170px); }
    #playBtn { --b: 100px; }
    #nextBtn { --b: 96px; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Space scene with a rocket, three moon houses and twinkly stars"></canvas>

<div id="progress" class="hud" aria-label="Parcels delivered this round">
  <div class="slot"><canvas width="128" height="128"></canvas></div>
  <div class="slot"><canvas width="128" height="128"></canvas></div>
  <div class="slot"><canvas width="128" height="128"></canvas></div>
</div>
<div id="rounds" class="hud" aria-label="Rounds finished"></div>

<div id="controls" class="hud">
  <button id="soundBtn" class="round-btn" type="button" aria-label="Sound on or off" aria-pressed="false">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M7 18h8l11-9v30l-11-9H7z" fill="#2d2a4a" stroke="#2d2a4a" stroke-width="3" stroke-linejoin="round"/>
      <g class="waves" fill="none" stroke="#2d2a4a" stroke-width="4" stroke-linecap="round"><path d="M32 17c3 4 3 10 0 14"/><path d="M37 12c6 7 6 17 0 24"/></g>
      <g class="cross" fill="none" stroke="#e8486f" stroke-width="5" stroke-linecap="round" style="display:none"><path d="M32 17l12 14"/><path d="M44 17L32 31"/></g>
    </svg>
  </button>
  <button id="motionBtn" class="round-btn" type="button" aria-label="Calm motion" aria-pressed="false">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M5 37h29c5 0 8-4 8-9v-6" fill="#b8f0da" stroke="#2d2a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="21" cy="25" r="11" fill="#ffb8d9" stroke="#2d2a4a" stroke-width="3"/>
      <path d="M21 25a3 3 0 1 1 3 -3a6 6 0 1 1 -8 6" fill="none" stroke="#2d2a4a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M39 22l-2-8M44 22l2-8" stroke="#2d2a4a" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="37" cy="13" r="2.4" fill="#2d2a4a"/><circle cx="46" cy="13" r="2.4" fill="#2d2a4a"/>
    </svg>
  </button>
  <button id="helpBtn" class="round-btn" type="button" aria-label="Show picture help">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="19" fill="#8ec5ff" stroke="#2d2a4a" stroke-width="3"/>
      <path d="M18 19c0-4 3-6 6-6s6 2 6 6c0 5-6 5-6 10" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="24" cy="35" r="2.8" fill="#fff"/>
    </svg>
  </button>
</div>

<div id="parcelCard" class="hud away" role="img" aria-label="The parcel to deliver"><canvas width="380" height="380"></canvas></div>
<div id="hand" aria-hidden="true"><canvas width="184" height="232"></canvas></div>

<button id="nextBtn" class="round-btn hud" type="button" aria-label="Deliver more parcels">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M50 34a18 18 0 1 1-5-15" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M47 8v13H34" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="22" y="26" width="20" height="17" rx="3" fill="#edb878" stroke="#2d2a4a" stroke-width="3"/>
    <path d="M32 26v17" stroke="#ff6fa5" stroke-width="3.5"/>
  </svg>
</button>

<div id="intro" role="dialog" aria-label="How to play, in pictures">
  <div class="steps">
    <div class="step"><canvas width="300" height="300"></canvas></div>
    <div class="step"><canvas width="300" height="300"></canvas></div>
    <div class="step"><canvas width="300" height="300"></canvas></div>
    <div class="step"><canvas width="300" height="300"></canvas></div>
  </div>
  <button id="playBtn" class="round-btn" type="button" aria-label="Play">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 9l24 15-24 15z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>
  </button>
</div>

<div id="nogl"><canvas width="300" height="300" style="width:240px;height:240px"></canvas></div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   Little Rocket: Moon Mail Delivery
   Everything is procedural: meshes, textures (canvas 2D) and sounds
   (Web Audio). No external assets are loaded.
   ===================================================================== */

// ---------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------
const TAU = Math.PI * 2;
const v3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const damp = (cur, target, rate, dt) => lerp(cur, target, 1 - Math.exp(-rate * dt));
const Ease = {
  linear: (t) => t,
  inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  outBack: (t) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outBounce: (t) => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
    return n * (t -= 2.625 / d) * t + 0.984375;
  },
};
function bezier3(p0, p1, p2, p3, t, out) {
  const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
  return out.set(
    a * p0.x + b * p1.x + c * p2.x + d * p3.x,
    a * p0.y + b * p1.y + c * p2.y + d * p3.y,
    a * p0.z + b * p1.z + c * p2.z + d * p3.z);
}
function bezier2(p0, p1, p2, t, out) {
  const u = 1 - t;
  return out.set(u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x, u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y, u * u * p0.z + 2 * u * t * p1.z + t * t * p2.z);
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};

const params = new URLSearchParams(location.search);
const TIME_SCALE = clamp(parseFloat(params.get('speed')) || 1, 0.25, 12);

// ---------------------------------------------------------------------
// Settings (sound + calm motion), remembered per device
// ---------------------------------------------------------------------
const settings = {
  muted: !!store.get('moonmail.muted', false),
  reduced: store.get('moonmail.reduced', null),
};
if (settings.reduced === null) {
  settings.reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// ---------------------------------------------------------------------
// Sound: tiny Web Audio synth. Nothing plays until the first tap,
// and nothing plays at all while muted.
// ---------------------------------------------------------------------
const PENTA = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.5];
const Sound = {
  ctx: null, out: null, noiseBuf: null,
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        this.out = this.ctx.createGain();
        this.out.gain.value = settings.muted ? 0 : 0.6;
        const comp = this.ctx.createDynamicsCompressor();
        this.out.connect(comp); comp.connect(this.ctx.destination);
        const len = this.ctx.sampleRate;
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch { this.ctx = null; return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  ok() { return !!this.ctx && !settings.muted && this.ctx.state === 'running'; },
  setMuted(m) {
    if (this.out) this.out.gain.setTargetAtTime(m ? 0 : 0.6, this.ctx.currentTime, 0.03);
  },
  tone(freq, o = {}) {
    if (!this.ok()) return;
    const { type = 'sine', dur = 0.3, vol = 0.2, at = 0, attack = 0.012, slide = 0, slideTime = 0, vibrato = 0, vibRate = 6, filter = 0 } = o;
    const c = this.ctx, t0 = c.currentTime + at;
    const osc = c.createOscillator(); osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t0 + (slideTime || dur));
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    if (vibrato) {
      const lfo = c.createOscillator(), lg = c.createGain();
      lfo.frequency.value = vibRate; lg.gain.value = vibrato;
      lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t0); lfo.stop(t0 + dur + 0.05);
    }
    if (filter) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filter; osc.connect(f); f.connect(g); }
    else osc.connect(g);
    g.connect(this.out); osc.start(t0); osc.stop(t0 + dur + 0.05);
  },
  noise(o = {}) {
    if (!this.ok()) return;
    const { dur = 0.6, vol = 0.12, at = 0, from = 400, to = 1600, q = 1.2 } = o;
    const c = this.ctx, t0 = c.currentTime + at;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.out); src.start(t0); src.stop(t0 + dur + 0.05);
  },
  arp(notes, gap = 0.09, o = {}) { notes.forEach((n, i) => this.tone(n, { type: 'triangle', dur: 0.35, vol: 0.14, ...o, at: (o.at || 0) + i * gap })); },
  // --- named sounds ---
  plink(i) { const f = PENTA[i % PENTA.length]; this.tone(f, { type: 'triangle', dur: 0.8, vol: 0.2 }); this.tone(f * 2, { dur: 0.45, vol: 0.05 }); },
  pop() { this.tone(520, { dur: 0.16, vol: 0.12, slide: 900 }); },
  curious() { this.tone(392, { dur: 0.22, vol: 0.15 }); this.tone(440, { at: 0.2, dur: 0.35, vol: 0.15, slide: 600 }); },
  thisWay() { this.tone(660, { dur: 0.55, vol: 0.1, slide: 990, attack: 0.05 }); this.tone(990, { at: 0.35, type: 'triangle', dur: 0.5, vol: 0.08 }); },
  boop() { this.tone(300, { dur: 0.2, vol: 0.12, slide: 450 }); },
  launch() { this.noise({ dur: 1.5, vol: 0.09, from: 250, to: 1500 }); this.tone(220, { type: 'triangle', dur: 1.3, vol: 0.07, slide: 660, attack: 0.2 }); },
  land() { this.tone(150, { dur: 0.25, vol: 0.2, slide: 80 }); this.arp([523.25, 659.25, 783.99, 1046.5], 0.08, { at: 0.12 }); },
  softLand() { this.tone(140, { dur: 0.2, vol: 0.14, slide: 80 }); },
  doorbell() { this.tone(659.25, { type: 'triangle', dur: 0.6, vol: 0.18 }); this.tone(523.25, { type: 'triangle', at: 0.38, dur: 0.8, vol: 0.18 }); },
  arf() {
    for (let k = 0; k < 2; k++) {
      this.tone(700, { at: k * 0.24, type: 'square', dur: 0.15, vol: 0.06, slide: 380, filter: 1500 });
      this.tone(520, { at: k * 0.24, type: 'triangle', dur: 0.16, vol: 0.1, slide: 300 });
    }
  },
  sing(f = 783.99) { this.tone(f, { dur: 1.7, vol: 0.18, attack: 0.18, vibrato: 9, vibRate: 5.5 }); this.tone(f * 2, { dur: 1.5, vol: 0.035, attack: 0.25 }); },
  horn() {
    this.tone(330, { type: 'sawtooth', dur: 0.55, vol: 0.08, slide: 560, filter: 1800 });
    this.tone(560, { at: 0.6, type: 'sawtooth', dur: 0.4, vol: 0.08, filter: 2200 });
    this.arp([783.99, 1046.5, 1318.5], 0.08, { at: 0.9, vol: 0.1 });
  },
  jingle() { this.arp([523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5], 0.12, { vol: 0.13 }); },
  boing(p = 1) { this.tone(170 * p, { dur: 0.5, vol: 0.2, slide: 430 * p, vibrato: 25, vibRate: 14 }); },
  whee() { this.tone(1400, { dur: 1.2, vol: 0.12, slide: 360, vibrato: 10, vibRate: 7, attack: 0.05 }); },
  balloon(i) { const f = PENTA[(i + 2) % PENTA.length]; this.tone(f, { dur: 0.6, vol: 0.17, slide: f * 1.06 }); this.tone(f * 1.5, { at: 0.08, type: 'triangle', dur: 0.4, vol: 0.05 }); },
  giggle() { [880, 990, 1110, 990].forEach((f, i) => this.tone(f, { at: i * 0.07, dur: 0.1, vol: 0.09 })); },
  sunHum() { this.tone(196, { dur: 1.1, vol: 0.13, vibrato: 3, attack: 0.1 }); this.tone(294, { dur: 1.1, vol: 0.08, attack: 0.15 }); },
  whoosh() { this.noise({ dur: 0.9, vol: 0.07, from: 1200, to: 300 }); },
};

// ---------------------------------------------------------------------
// Symbols (drawn with canvas 2D; used on parcels, signs and the HUD)
// ---------------------------------------------------------------------
const INKC = '#2d2a4a';
const INK = 0x2d2a4a;
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function fs(c, fill, s, lw = 0.05) { c.fillStyle = fill; c.fill(); c.lineWidth = s * lw; c.strokeStyle = INKC; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
function dot(c, x, y, r, fill = INKC) { circ(c, x, y, r); c.fillStyle = fill; c.fill(); }
function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function line(c, x1, y1, x2, y2, w, col = INKC) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineWidth = w; c.strokeStyle = col; c.lineCap = 'round'; c.stroke(); }
function starPath(c, x, y, n, R, r) {
  c.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r : R; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }

const toonGrad = (() => {

  t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;

})();
const matCache = new Map();
function M(color, extra) {
  if (extra) return new THREE.MeshToonMaterial({ color, gradientMap: toonGrad, ...extra });
  const key = new THREE.Color(color).getHex();

}

function flatSphere(r, cutY, w = 48, h = 32) {

}
function addCraters(parent, R, color, n, avoidTop = 0.6) {
  const mat = M(color);

    let dir;
    do { dir = v3(rand(-1, 1), rand(-0.9, 0.7), rand(-0.2, 1)).normalize(); } while (dir.y > avoidTop);

function makeAlien(i) {

  const head = new THREE.Group(); head.position.y = 0.93; bodyG.add(head);
  head.add(mk(G.sph, mat, 0, 0, 0, 0.34, 0.32, 0.32));
  const xs = A.eyes === 1 ? [0] : A.eyes === 2 ? [-0.12, 0.12] : [-0.155, 0, 0.155];

  for (const x of xs) {

    eg.add(mk(G.sph, M(0xffffff), x, y, zz, r, r, r * 0.6));

  addBlinker(eg);
  const sm = new THREE.Mesh(G.smile, M(INK)); sm.position.set(0, -0.13, 0.29); sm.rotation.z = Math.PI; sm.scale.setScalar(0.9); head.add(sm);
  const oMouth = new THREE.Mesh(G.ring, M(INK)); oMouth.position.set(0, -0.15, 0.29); oMouth.scale.setScalar(0.55); oMouth.visible = false; head.add(oMouth);
  for (const s of [-1, 1]) head.add(mk(G.sphLo, M(0xff9fbf), s * 0.22, -0.1, 0.23, 0.05, 0.035, 0.02));
  const ants = A.eyes === 1 ? [0] : [-0.13, 0.13];

  }
  const arm = (s) => {
    const p = new THREE.Group(); p.position.set(s * 0.25, 0.57, 0); p.rotation.order = 'YXZ';
    p.add(mk(G.cyl, mat, 0, -0.15, 0, 0.055, 0.3, 0.055));
    const hand = mk(G.sph, mat, 0, -0.32, 0, 0.085); p.add(hand); p.userData.hand = hand;
    p.rotation.z = s * 0.35; bodyG.add(p); return p;

function buildHouse(h) {
  const g = new THREE.Group(), pal = h.palette, anims = [];
  const bodyMat = M(pal.body), roofMat = M(pal.roof), accMat = M(pal.accent);
  g.add(mk(new THREE.CylinderGeometry(0.5, 0.55, 0.8, 28), bodyMat, 0, 0.4, 0));
  const door = mk(new THREE.CapsuleGeometry(0.15, 0.2, 6, 14), M(0x9B6B4A), 0, 0.22, 0.52, 1, 1, 0.28); g.add(door);
  g.add(mk(G.sphLo, M(0xFFD84D), 0.08, 0.24, 0.57, 0.03));
  for (const a of [0.8, -0.8]) {
    const w = new THREE.Group(); w.rotation.y = a; g.add(w);
    const fr = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.03, 8, 20), roofMat); fr.position.set(0, 0.52, 0.52); w.add(fr);
    w.add(mk(new THREE.CircleGeometry(0.1, 20), new THREE.MeshBasicMaterial({ color: 0xFFF3B0 }), 0, 0.52, 0.515));
  }
  let roofTop;
  if (h.roofStyle === 'cone') {
    g.add(mk(G.cone, roofMat, 0, 1.12, 0, 0.7, 0.64, 0.7)); g.add(mk(G.sph, roofMat, 0, 1.45, 0, 0.07)); roofTop = 1.48;
  } else if (h.roofStyle === 'dome') {
    g.add(mk(new THREE.SphereGeometry(0.6, 28, 14, 0, TAU, 0, Math.PI / 2), roofMat, 0, 0.78, 0, 1, 0.85, 1)); roofTop = 1.29;
  } else {
    g.add(mk(new THREE.SphereGeometry(0.6, 28, 14, 0, TAU, 0, Math.PI / 2), roofMat, 0, 0.76, 0, 1.3, 0.8, 1.3)); roofTop = 1.24;
    for (let i = 0; i < 6; i++) {
      const a = i * TAU / 6 + 0.3, el = i % 2 ? 0.55 : 1.0;
      const d = v3(Math.cos(a) * Math.sin(el), Math.cos(el), Math.sin(a) * Math.sin(el));
      const m = mk(G.sphLo, M(0xffffff), d.x * 0.78, 0.76 + d.y * 0.48, d.z * 0.78, 0.09, 0.09, 0.03);
      m.quaternion.setFromUnitVectors(v3(0, 0, 1), d.normalize()); g.add(m);
    }
  }
  for (const d of h.decor) {
    if (d === 'flag') {
      g.add(mk(G.cyl, M(0xffffff), 0, roofTop + 0.28, 0, 0.025, 0.56, 0.025));
      const fs2 = new THREE.Shape(); fs2.moveTo(0, 0); fs2.lineTo(0.36, 0.1); fs2.lineTo(0, 0.22); fs2.closePath();
      const fl = new THREE.Group(); fl.position.set(0.02, roofTop + 0.3, 0); g.add(fl);
      fl.add(new THREE.Mesh(new THREE.ExtrudeGeometry(fs2, { depth: 0.02, bevelEnabled: false }), accMat));
      anims.push((t, amb) => { fl.rotation.y = Math.sin(t * 2.2) * 0.35 * amb; });
    } else if (d === 'antenna') {
      g.add(mk(G.cyl, M(0xCCCCDD), -0.0, roofTop + 0.22, 0, 0.022, 0.45, 0.022));
      const b = mk(G.sph, M(pal.accent, { emissive: pal.accent, emissiveIntensity: 0.3 }), 0, roofTop + 0.48, 0, 0.1); g.add(b);
      anims.push((t, amb) => { b.position.y = roofTop + 0.48 + Math.sin(t * 2) * 0.03 * amb; });
    } else if (d === 'chimney') {
      const ch = mk(G.cyl, M(0xD98B6B), 0.3, roofTop - 0.25, -0.12, 0.09, 0.42, 0.09); g.add(ch);
      g.add(mk(G.cyl, M(0xB86F55), 0.3, roofTop - 0.03, -0.12, 0.11, 0.05, 0.11));
      let next = rand(0, 1.5);
      anims.push((t, amb, dt) => {
        if (!amb) return; next -= dt; if (next > 0) return; next = 1.4;
        const p = ch.getWorldPosition(v3()); p.y += 0.3; particles.emit(p, { vel: v3(0.1, 0.45, 0), life: 2.4, size: 0.18, size1: 0.45, color: 0xffffff, opacity: 0.7 });
      });
    } else if (d === 'flowers') {
      for (const a of [0.55, -0.6, 1.3]) {
        const x = Math.sin(a) * 0.68, z = Math.cos(a) * 0.68;
        g.add(mk(G.cyl, M(0x4FCB6B), x, 0.1, z, 0.02, 0.2, 0.02));
        g.add(mk(G.sph, accMat, x, 0.22, z, 0.08)); g.add(mk(G.sphLo, M(0xFFE16B), x, 0.22, z + 0.06, 0.035));
      }
    } else if (d === 'bow') {
      const by = h.roofStyle === 'cone' ? 0.92 : 0.86;
      for (const s of [-1, 1]) { const m = mk(G.sph, accMat, s * 0.14, by, 0.56, 0.13, 0.08, 0.05); m.rotation.z = s * 0.4; g.add(m); }
      g.add(mk(G.sph, accMat, 0, by, 0.58, 0.06));
    } else if (d === 'star') {
      const st = mk(STAR_GEO, M(0xFFD84D, { emissive: 0xffc83d, emissiveIntensity: 0.25 }), 0, roofTop + 0.26, 0, 0.42); g.add(st);
      anims.push((t, amb) => { st.rotation.y = Math.sin(t * 0.8) * 0.5 * amb; });
    } else if (d === 'dots') {

function halfPipeGeometry(curve, segs = 48, radius = 0.32, K = 10) {
  const pos = [], idx = [], UP = v3(0, 1, 0);
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, c = curve.getPointAt(t), T = curve.getTangentAt(t);
    const side = v3().crossVectors(T, UP).normalize(), upn = v3().crossVectors(side, T).normalize();
    for (let k = 0; k <= K; k++) {
      const a = Math.PI * (k / K);
      const p = c.clone().addScaledVector(side, Math.cos(a) * radius).addScaledVector(upn, -Math.sin(a) * radius * 0.7);
      pos.push(p.x, p.y, p.z);
    }
  }
  for (let i = 0; i < segs; i++) for (let k = 0; k < K; k++) {
    const a = i * (K + 1) + k, b = a + K + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}

const particles = {
  items: [], cursor: 0,
  init(n) {
    for (let i = 0; i < n; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, transparent: true, depthWrite: false, opacity: 0 }));
      s.visible = false; scene.add(s);
      this.items.push({ s, life: 0, max: 1, vel: v3(), grav: 0, drag: 0.6, s0: 1, s1: 0, o0: 1 });
    }
  },
  emit(pos, { vel = null, life = 1, size = 0.4, size1 = 0, color = 0xffffff, opacity = 0.9, grav = 0, drag = 0.6 } = {}) {
    const p = this.items[this.cursor]; this.cursor = (this.cursor + 1) % this.items.length;
    p.s.position.copy(pos); p.vel.copy(vel || v3()); p.life = p.max = life; p.grav = grav; p.drag = drag;
    p.s0 = size; p.s1 = size1; p.o0 = opacity; p.s.material.color.set(color); p.s.visible = true; p.s.scale.setScalar(size); p.s.material.opacity = opacity;
  },
  update(dt) {
    for (const p of this.items) {
      if (!p.s.visible) continue;
      p.life -= dt;
      if (p.life <= 0) { p.s.visible = false; continue; }
      const k = 1 - p.life / p.max;
      p.vel.y -= p.grav * dt; p.vel.multiplyScalar(Math.exp(-p.drag * dt));
      p.s.position.addScaledVector(p.vel, dt);
      p.s.scale.setScalar(Math.max(0.001, lerp(p.s0, p.s1, k)));
      p.s.material.opacity = p.o0 * (1 - k * k);
    }
  },
};
const confetti = {
  items: [], cursor: 0,
  init(n) {
    const geo = new THREE.PlaneGeometry(0.12, 0.2), cols = [0xFF9AA2, 0xFFE66D, 0x9BE7A0, 0x8EC5FF, 0xC3A6FF, 0xFFB347];
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: cols[i % cols.length], side: THREE.DoubleSide }));
      m.visible = false; scene.add(m); this.items.push({ m, life: 0, vel: v3(), spin: v3() });
    }
  },
  burst(pos, n = 24) {
    for (let i = 0; i < n; i++) {
      const p = this.items[this.cursor]; this.cursor = (this.cursor + 1) % this.items.length;
      p.m.position.copy(pos); p.vel.set(rand(-1.4, 1.4), rand(1.6, 3.2), rand(-0.6, 1.2)); p.spin.set(rand(-3, 3), rand(-3, 3), rand(-3, 3));
      p.life = rand(2.4, 3.2); p.m.visible = true; p.m.scale.setScalar(1);
    }
  },
  update(dt) {
    for (const p of this.items) {
      if (!p.m.visible) continue;
      p.life -= dt; if (p.life <= 0) { p.m.visible = false; continue; }
      p.vel.y -= 2.2 * dt; p.vel.multiplyScalar(Math.exp(-1.6 * dt)); p.vel.y = Math.max(p.vel.y, -0.8);
      p.m.position.addScaledVector(p.vel, dt);
      p.m.rotation.x += p.spin.x * dt; p.m.rotation.y += p.spin.y * dt; p.m.rotation.z += p.spin.z * dt;
      if (p.life < 0.6) p.m.scale.setScalar(p.life / 0.6);
    }
  },
};
const TRAIL_COLORS = [0xFF9AA2, 0xFFB347, 0xFFE66D, 0x9BE7A0, 0x8EC5FF, 0xC3A6FF];
function poof(pos, color = 0xffffff, n = 8, spread = 0.8) {
  const k = settings.reduced ? Math.ceil(n / 3) : n;
  for (let i = 0; i < k; i++) {
    const a = i / k * TAU;
    particles.emit(pos, { vel: v3(Math.cos(a) * spread, rand(0.2, 0.8), Math.sin(a) * spread), life: 1.1, size: 0.35, size1: 0.6, color, opacity: 0.85, drag: 2 });
  }
}

// Time + tweens (game time, so the ?speed= test flag scales everything)
// ---------------------------------------------------------------------
const clock = { t: 0 };
const tasks = new Set();
function tween(dur, fn, ease = Ease.inOutSine) {
  return new Promise((resolve) => {
    if (dur <= 0) { fn(1, 1); resolve(); return; }
    fn(0, 0); tasks.add({ t: 0, dur, fn, ease, resolve });
  });
}
const wait = (sec) => tween(sec, () => {}, Ease.linear);
function updateTasks(dt) {

const LAYOUTS = {
  wide: {
    moons: [v3(-8.2, 0, -0.2), v3(0, 0.4, -5.2), v3(8.2, 0, -0.2)],
    home: v3(0, -2.6, 7.0), play: v3(0, -0.9, 1.2), playScale: 1.15,

    clusters: [{ ndc: [0.42, 0.8], mult: 2.0 }, { ndc: [-0.93, -0.1], mult: 1.4 }, { ndc: [0.86, -0.7], mult: 1.2 }],
  },
  tall: {
    moons: [v3(-3.7, 0, -2.4), v3(0, 0.4, -9.2), v3(3.7, 0, -2.4)],
    home: v3(0, -2.6, 7.8), play: v3(0, -1.0, 2.6), playScale: 0.86,
    camDir: v3(0, 1.05, 1).normalize(), look: v3(0, 0.4, -0.6), fov: 42, yTop: 0.7, yBot: -0.97, xMax: 0.985,
    sun: { ndc: [0.3, 0.87], mult: 3.0, scale: 0.42 },
    clusters: [{ ndc: [-0.8, -0.16], mult: 1.5 }, { ndc: [0.8, -0.18], mult: 1.5 }, { ndc: [0.74, -0.64], mult: 1.2 }],
  },
};
let layout = LAYOUTS.wide, layoutName = 'wide', camDist = 30;
function placeCamera(d) { camera.position.copy(layout.look).addScaledVector(layout.camDir, d); camera.lookAt(layout.look); camera.updateMatrixWorld(); }
function fitPoints() {
  const pts = [];
  for (const m of layout.moons) pts.push(m.clone().add(v3(-2.3, -2.0, 0)), m.clone().add(v3(2.3, -2.0, 0)), m.clone().add(v3(-1.2, 4.9, -1.0)), m.clone().add(v3(1.2, 4.9, -1.0)), m.clone().add(v3(0, -2.0, 2.0)));
  const h = layout.home; pts.push(h.clone().add(v3(-3.4, 0, 0)), h.clone().add(v3(3.4, 0, 0)), h.clone().add(v3(0, -2.4, 1.6)), h.clone().add(v3(0, 4.4, 0)));
  return pts;
}
function fitCamera() {
  const w = window.innerWidth, h = window.innerHeight;
  const name = w / h < 0.95 ? 'tall' : 'wide';
  layout = LAYOUTS[name]; layoutName = name;
  camera.aspect = w / h; camera.fov = layout.fov; camera.updateProjectionMatrix();
  const pts = fitPoints(), p = v3();
  let lo = 4, hi = 300;
  for (let i = 0; i < 34; i++) {
    const d = (lo + hi) / 2; placeCamera(d);
    let ok = true;
    for (const q of pts) { p.copy(q).project(camera); if (Math.abs(p.x) > layout.xMax || p.y > layout.yTop || p.y < layout.yBot || p.z > 1) { ok = false; break; } }
    if (ok) hi = d; else lo = d;
  }
  camDist = hi; placeCamera(hi);
  moons.forEach((m, i) => { m.anchor.copy(layout.moons[i]); });
  home.group.position.copy(layout.home);
  playground.root.position.copy(layout.play); playground.root.scale.setScalar(layout.playScale);
  placeByNdc(sun.group, layout.sun.ndc, layout.sun.mult); sun.group.scale.setScalar(layout.sun.mult * 0.55 * layout.sun.scale * camDist / 30);
  sun.group.lookAt(camera.position);
  clusters.forEach((c, k) => { const L = layout.clusters[k]; placeByNdc(c.group, L.ndc, L.mult); c.base = c.group.position.clone(); c.group.scale.setScalar(L.mult * 0.62 * camDist / 30); c.group.lookAt(camera.position); });
  if (state.rocketAt === 'home' && !rocket.flying) home.group.updateMatrixWorld(true), rocket.root.position.copy(home.group.localToWorld(home.padLocal.clone()));
  renderer.setSize(w, h, false);
}
function placeByNdc(obj, ndc, mult) {
  const dir = v3(ndc[0], ndc[1], 0.5).unproject(camera).sub(camera.position).normalize();
  obj.position.copy(camera.position).addScaledVector(dir, camDist * mult);
}

const state = {
  phase: 'intro', round: 1, roundDelivered: 0, totalDelivered: 0, roundsDone: 0,
  houses: [], queue: [], surpriseOrder: [], parcel: null, target: -1,
  rocketAt: 'home', idle: 0, everDelivered: false, hints: 0, lastHint: null,
  surprises: [], play: { tramp: 0, slide: 0, balloon: 0 }, plinks: 0, log: [],
};
let parcel = null; // { mesh, symbol }

function setupRound() {
  const prev = state.houses.map((h) => h.symbol);
  const prevPal = state.houses.map((h) => h.palette);
  const prevDecor = state.houses.map((h) => h.decor.join());
  const symbols = chooseSymbols(prev);
  let pals;
  do { pals = shuffle(HOUSE_PALETTES).slice(0, 3); } while (prevPal.length && pals.some((p, i) => p === prevPal[i]));
  const roofs = shuffle(ROOFS);
  let decor;
  do { const d = shuffle(DECORS); decor = [[d[0], d[1]], [d[2], d[3]], [d[4], d[5]]]; } while (prevDecor.length && decor.some((d, i) => d.join() === prevDecor[i]));
  state.houses = symbols.map((s, i) => ({ symbol: s, palette: pals[i], roofStyle: roofs[i], decor: decor[i] }));
  state.queue = shuffle([0, 1, 2]);
  state.surpriseOrder = shuffle(['puppy', 'flower', 'hat']);
  state.roundDelivered = 0;
}
function applyHouse(m) {
  if (m.house) { m.houseSlot.remove(m.house.group); }
  m.house = buildHouse(state.houses[m.index]);
  m.houseSlot.add(m.house.group);
  setSignSymbol(m.sign, state.houses[m.index].symbol);
}

function makeParcelMesh(key) {
  const g = new THREE.Group();
  const lab = new THREE.MeshToonMaterial({ map: parcelTexture(key), gradientMap: toonGrad });
  const plain = M(0xEDB878);
  g.add(new THREE.Mesh(G.box, [lab, lab, plain, plain, lab, lab]));
  const rib = M(0xFF6FA5);
  g.add(mk(G.box, rib, 0, 0.505, 0, 1.02, 0.02, 0.16), mk(G.box, rib, 0, 0.505, 0, 0.16, 0.02, 1.02));
  for (const s of [-1, 1]) { const b = mk(G.sph, rib, s * 0.17, 0.6, 0, 0.17, 0.1, 0.07); b.rotation.z = s * 0.5; g.add(b); }
  g.add(mk(G.sph, M(0xFF8FBA), 0, 0.58, 0, 0.08));
  g.scale.setScalar(0.8);
  return g;
}

// Game flow

const flightDur = () => (settings.reduced ? 3.2 : 2.6);

function setFlame(on) { rocket.flameTarget = on ? 1 : 0; if (on) rocket.flame.visible = true; }

function flyTo(getTarget, dur) {
  const p0 = rocket.root.position.clone(), prev = p0.clone(), p1 = v3(), p2 = v3(), out = v3();
  rocket.flying = true; setFlame(true);
  return tween(dur, (e) => {
    const p3 = getTarget();
    const lift = Math.max(4.2, p0.distanceTo(p3) * 0.42);
    p1.copy(p0).add(v3(0, lift, 0.9)); p2.copy(p3).add(v3(0, lift * 0.85, 0.9));
    bezier3(p0, p1, p2, p3, e, out);
    rocket.root.position.copy(out);
    rocket.vel.copy(out).sub(prev); prev.copy(out);
  }, Ease.inOutSine).then(() => { rocket.flying = false; setFlame(false); rocket.vel.set(0, 0, 0); });
}
async function squash(obj, amt = 0.15, dur = 0.35) {
  if (settings.reduced) return;
  await tween(dur, (e, k) => { const s = Math.sin(k * Math.PI) * amt; obj.scale.set(1 + s, 1 - s, 1 + s); }, Ease.linear);
  obj.scale.set(1, 1, 1);
}
const padWorld = (m) => m.group.localToWorld(m.padLocal.clone());
const homePadWorld = () => home.group.localToWorld(home.padLocal.clone());

async function loadParcel() {
  const target = state.queue[state.roundDelivered];
  const sym = state.houses[target].symbol;
  state.parcel = sym; state.target = target;
  if (parcel) rocket.holder.remove(parcel.mesh);
  parcel = { mesh: makeParcelMesh(sym), symbol: sym };
  parcel.mesh.position.set(-0.12, 0, 0); rocket.holder.add(parcel.mesh);
  const s0 = parcel.mesh.scale.x;
  Sound.pop();
  poof(rocket.holder.getWorldPosition(v3()), 0xFFE58A, 6, 0.6);
  await tween(0.45, (e) => parcel.mesh.scale.setScalar(Math.max(0.001, s0 * e)), settings.reduced ? Ease.outCubic : Ease.outBack);
  ui.setCard(sym);
  state.phase = 'choose'; state.idle = state.everDelivered ? 0 : 99;
  log('parcel', { symbol: sym, target });
}

function onHouseTap(i) {
  const m = moons[i];
  if (state.phase === 'choose') {
    state.idle = 0; ui.setHand(false);
    if (i === state.target) deliver(i);
    else friendlyHint(i, state.target);
    return;
  }
  if (m.alien.root.parent === m.group && state.phase !== 'intro') { m.alien.setPose('wave', 0.9); Sound.boop(); }
  m.bounce = 1;
}

let hintToken = 0;
async function friendlyHint(i, target) {
  const token = ++hintToken, m = moons[i];
  state.hints++; state.lastHint = { from: i, to: target, symbol: state.parcel };
  log('hint', { from: i, to: target });
  Sound.curious();
  m.alien.setPose('wave', 1.0); m.bounce = 0.6;
  ui.card.classList.remove('wiggle'); void ui.card.offsetWidth; ui.card.classList.add('wiggle');
  await wait(0.85);
  if (token !== hintToken || state.phase !== 'choose') return;
  m.alien.setPose('point', 2.6, target);
  hintArc.from = i; hintArc.to = target; hintArc.t0 = clock.t; hintArc.dur = 2.8; hintArc.group.visible = true;
  moons[target].sign.glow = 2.8;
  Sound.thisWay();
}

async function deliver(i) {
  const m = moons[i], k = state.roundDelivered, sym = state.parcel;
  state.phase = 'flying'; state.rocketAt = 'flying';
  hintToken++; hintArc.group.visible = false; ui.setHand(false); ui.hideCard();
  log('launch', { to: i });
  m.alien.setPose('cheer', 1.5);
  Sound.launch();
  await squash(rocket.body, 0.14, 0.3);
  await flyTo(() => padWorld(m), flightDur());
  m.group.attach(rocket.root); rocket.root.position.copy(m.padLocal);
  state.rocketAt = i; state.phase = 'delivering';
  Sound.land(); poof(padWorld(m), 0xffffff, 8, 0.9); squash(rocket.body, 0.12, 0.3);
  log('landed', { at: i });
  await wait(0.3);
  // The parcel hops from the rocket into the house
  const p = parcel.mesh; scene.attach(p); const from = p.position.clone(), s0 = p.scale.x;
  await tween(0.85, (e, kk) => {
    const to = m.house.group.localToWorld(m.house.door.clone());
    p.position.lerpVectors(from, to, e); p.position.y += Math.sin(kk * Math.PI) * 1.1;
    if (!settings.reduced) p.rotation.y = kk * Math.PI;
    p.scale.setScalar(s0 * lerp(1, 0.3, clamp((kk - 0.6) / 0.4, 0, 1)));
  }, Ease.linear);
  scene.remove(p); parcel = null;
  Sound.doorbell(); m.bounce = 1; m.alien.setPose('cheer', 1.6);
  state.roundDelivered++; state.totalDelivered++; state.everDelivered = true;
  ui.fillSlot(k, sym);
  log('delivered', { house: i, symbol: sym });
  await wait(0.35);
  const type = state.surpriseOrder[k];
  await revealSurprise(m, type);
  state.surprises.push({ house: i, type, round: state.round });
  log('surprise', { house: i, type });
  await wait(0.9);
  // fly home
  state.phase = 'returning';
  scene.attach(rocket.root); state.rocketAt = 'flying';
  Sound.whoosh();
  await flyTo(homePadWorld, flightDur() * 0.85);
  rocket.root.position.copy(homePadWorld()); state.rocketAt = 'home';
  Sound.softLand(); squash(rocket.body, 0.1, 0.3);
  if (state.roundDelivered >= 3) await startPlayground();
  else await loadParcel();
}

async function revealSurprise(m, type) {
  const doorLocal = m.group.worldToLocal(m.house.group.localToWorld(m.house.door.clone()));
  const spot = m.surpriseLocal.clone();
  if (type === 'puppy') {
    const pup = makePuppy(); m.group.add(pup.root); pup.root.position.copy(doorLocal); pup.root.scale.setScalar(0.01);
    m.surprise = pup; pup.home = m;
    await tween(0.8, (e, k) => {
      pup.root.position.lerpVectors(doorLocal, spot, e); pup.root.position.y += Math.sin(k * Math.PI) * 0.8;
      pup.root.scale.setScalar(Math.max(0.01, PUP_SCALE * (settings.reduced ? Ease.outCubic(k) : Ease.outBack(k))));
    }, Ease.linear);
    Sound.arf(); pup.excite = 2; poof(m.group.localToWorld(spot.clone()), 0xFFF3E0, 8, 0.7);
  } else if (type === 'flower') {
    const fl = makeFlower(); m.group.add(fl.root); fl.root.position.copy(spot).add(v3(0.25, 0, -0.1)); fl.root.scale.setScalar(FLOWER_SCALE);
    m.surprise = fl;
    fl.stem.scale.set(1, 0.01, 1); fl.head.scale.setScalar(0.01);
    await tween(0.8, (e) => fl.stem.scale.set(1, Math.max(0.01, e), 1), Ease.outCubic);
    await tween(0.5, (e, k) => fl.head.scale.setScalar(Math.max(0.01, settings.reduced ? e : Ease.outBack(k))), Ease.linear);
    singFlower(fl);
    await wait(1.0);
  } else {
    const hat = makeHat(); const a = m.alien; a.head.add(hat.root);
    m.surprise = hat; hat.alien = a;
    const restY = 0.24, startY = 3.6;
    hat.root.position.y = startY; hat.root.scale.setScalar(1.15);
    await tween(1.0, (e) => { hat.root.position.y = lerp(startY, restY, e); }, settings.reduced ? Ease.inOutSine : Ease.outBounce);
    squash(a.root, 0.18, 0.35); a.setPose('cheer', 1.8);
    Sound.horn();
    const p = a.head.getWorldPosition(v3()); p.y += 1.2;
    if (settings.reduced) poof(p, 0xFFE16B, 6, 0.5); else confetti.burst(p, 26);
    await wait(0.8);
  }
}

function singFlower(fl) {
  fl.singT = 1.7; Sound.sing(fl.note);
  const n = makeNoteMesh(), start = fl.head.getWorldPosition(v3()).add(v3(0.25, 0.25, 0.2));
  scene.add(n); n.position.copy(start);
  tween(1.8, (e, k) => {
    n.position.copy(start).add(v3(Math.sin(k * 5) * 0.12 * (settings.reduced ? 0 : 1), e * 1.3, 0));
    n.scale.setScalar(Math.max(0.01, Math.sin(Math.min(1, k * 1.2) * Math.PI) * 1.4));
    n.lookAt(camera.position);
  }, Ease.outCubic).then(() => scene.remove(n));
}

function surpriseTap(obj) {
  if (obj.type === 'puppy') { obj.excite = 1.6; Sound.arf(); }
  else if (obj.type === 'flower') { if (obj.singT <= 0) singFlower(obj); }
  else if (obj.type === 'hat') {
    obj.wobble = 1; Sound.horn(); obj.alien.setPose('cheer', 1.4);
    const p = obj.root.getWorldPosition(v3()); p.y += 1;
    if (settings.reduced) poof(p, 0xFFE16B, 5, 0.4); else confetti.burst(p, 14);
  }
}

// Move an object along a gentle arc to a spot inside another parent
async function hopTo(obj, parentTo, localTo, dur = 1.2, height = 2.4, finalScale = 1) {
  scene.attach(obj);
  const from = obj.position.clone(), s0 = obj.scale.x, s1 = parentTo.getWorldScale(v3()).x * finalScale;
  const yaw0 = obj.rotation.y;
  await tween(dur, (e, k) => {
    const to = parentTo.localToWorld(localTo.clone());
    obj.position.lerpVectors(from, to, e); obj.position.y += Math.sin(k * Math.PI) * height;
    obj.scale.setScalar(lerp(s0, s1, e)); obj.rotation.y = lerp(yaw0, 0, e);
  }, Ease.inOutSine);
  parentTo.attach(obj); obj.position.copy(localTo); obj.rotation.set(0, 0, 0); obj.scale.setScalar(finalScale);
}

async function startPlayground() {
  state.phase = 'gathering'; state.roundsDone++;
  ui.hideCard(); ui.addRoundStar();
  log('playground', { round: state.round });
  Sound.jingle();
  const pg = playground;
  pg.root.visible = true; pg.stage.scale.setScalar(0.01);
  pg.pieces.forEach((p) => p.scale.setScalar(0.01));
  await tween(0.9, (e, k) => pg.stage.scale.setScalar(Math.max(0.01, settings.reduced ? e : Ease.outBack(k))), Ease.linear);
  await Promise.all(moons.map(async (m, i) => {

  if (state.phase === 'choose') {
    state.idle += dt;
    const show = state.idle > (state.everDelivered ? 9 : 1.0);
    if (show !== ui.handVisible) ui.setHand(show);
    if (show) {
      const m = moons[state.target];
      const s = toScreen(m.group.localToWorld(v3(-0.05, 2.2, 0.2)));
      ui.hand.style.transform = `translate(${Math.round(s.x - 46)}px, ${Math.round(s.y)}px)`;
      m.sign.glow = Math.max(m.sign.glow, 0.2);
    }
  } else if (ui.handVisible) ui.setHand(false);
}

// ---------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------
setupRound();
moons.forEach(applyHouse);
fitCamera();
home.group.updateMatrixWorld(true);
rocket.root.position.copy(homePadWorld());
drawTutorial();
ui.syncButtons();
window.addEventListener('resize', fitCamera);
if (params.has('autostart')) { ui.intro.classList.add('hidden'); startGame(); }

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)) * TIME_SCALE; last = now;
  clock.t += dt;
  updateTasks(dt);
  update(dt, clock.t);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------------
// Read-only hooks used by the automated checks (scripts/verify.mjs)
// ---------------------------------------------------------------------
window.moonMail = {
  snapshot() {
    return JSON.parse(JSON.stringify({
      phase: state.phase, round: state.round, roundDelivered: state.roundDelivered, totalDelivered: state.totalDelivered,
      roundsDone: state.roundsDone, parcel: state.parcel, target: state.target, rocketAt: state.rocketAt,
      houses: state.houses.map((h) => ({ symbol: h.symbol, roofStyle: h.roofStyle, decor: h.decor, roof: h.palette.roof })),
      signs: moons.map((m) => Object.keys(SYMBOLS).find((k) => m.sign.faceMat.map === texCache.get('sign-' + k))),
      surprises: state.surprises, hints: state.hints, lastHint: state.lastHint, play: state.play, plinks: state.plinks,
      muted: settings.muted, reduced: settings.reduced, layout: layoutName,
      rocket: rocket.root.getWorldPosition(v3()).toArray(),
      pads: moons.map((m) => padWorld(m).toArray()), homePad: homePadWorld().toArray(),
      alienPose: moons.map((m) => (m.alien.pose.until > clock.t ? m.alien.pose.mode : 'idle')),
      surprisesVisible: moons.map((m) => (m.surprise ? m.surprise.type : null)),
      playgroundVisible: playground.root.visible, nextVisible: ui.next.classList.contains('show'),
      log: state.log,
    }));
  },
  screen(kind, i = 0) {
    let w;
    if (kind === 'house') w = moons[i].group.localToWorld(v3(-0.05, 2.0, -0.2));
    else if (kind === 'sign') w = moons[i].sign.board.getWorldPosition(v3());
    else if (kind === 'star') w = allStars[i].group.getWorldPosition(v3());
    else if (kind === 'tramp') w = playground.tramp.localToWorld(v3(0, 0.5, 0));
    else if (kind === 'slide') w = playground.slide.localToWorld(v3(0.9, 0.9, 1.0));
    else if (kind === 'balloon') w = playground.balloons[i].group.getWorldPosition(v3());
    else if (kind === 'rocket') w = rocket.root.localToWorld(v3(0, 1, 0));
    else if (kind === 'sun') w = sun.group.getWorldPosition(v3());
    return toScreen(w);
  },
};
</script>
